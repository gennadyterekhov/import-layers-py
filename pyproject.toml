[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[project]
name = "import-layers-py"
version = "0.1.0"
description = "Check dependency direction between Python project layers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
import-layers-py = "import_layers_py.analyzer.app:main"
